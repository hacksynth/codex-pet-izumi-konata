name: Feature request / 功能建议
description: Propose a focused repository or pet improvement / 提议范围清晰的仓库或宠物改进
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change / 建议改动
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: Scope / 范围
      options:
        - label: This proposal respects the existing licensing and asset-rights boundary. / 本提案遵守现有许可与素材权利边界。
          required: true
