[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-pet-validator"
version = "0.1.0"
description = "Deterministic validator for the Izumi Konata Codex v2 pet package"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hacksynth" }]
dependencies = ["Pillow==12.3.0"]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
  "types-Pillow>=10.2",
]

[project.scripts]
validate-codex-pet = "codex_pet_validator.cli:main"
check-dco = "codex_pet_validator.dco:main"
generate-codex-previews = "codex_pet_validator.preview_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
